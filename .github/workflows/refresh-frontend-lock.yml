name: Refresh frontend dependency lockfile

on:
  push:
    branches:
      - feat/comprehensive-school-cms-upgrade
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/comprehensive-school-cms-upgrade
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "chore(frontend): refresh dependency lockfile"
          git push origin feat/comprehensive-school-cms-upgrade
